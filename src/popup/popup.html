<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Copilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #111;
    }
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 20px 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.85;
    }
    .status {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.active { background: #22c55e; }
    .status-text {
      font-size: 13px;
      color: #374151;
    }
    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .site-access {
      margin: 0 16px 12px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      background: #f9fafb;
    }
    .site-access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .site-access-title { font-size: 13px; font-weight: 600; color: #1f2937; }
    .site-access-desc { margin-top: 5px; font-size: 11px; line-height: 1.45; color: #6b7280; }
    .site-access-status { margin-top: 6px; font-size: 11px; color: #4f46e5; }
    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-track {
      position: absolute; inset: 0; cursor: pointer; border-radius: 999px;
      background: #d1d5db; transition: .2s;
    }
    .switch-track::before {
      content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .switch input:checked + .switch-track { background: #6366f1; }
    .switch input:checked + .switch-track::before { transform: translateX(16px); }
    .switch input:disabled + .switch-track { opacity: .55; cursor: wait; }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      color: #374151;
    }
    .btn:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }
    .btn-icon { font-size: 16px; }
    .footer {
      padding: 10px 16px;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }
    .shortcut {
      display: inline-block;
      padding: 1px 6px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      font-size: 10px;
      margin-left: auto;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Doc Copilot</h1>
    <p>AI-powered writing assistant</p>
  </div>
  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Checking...</span>
  </div>
  <div class="actions">
    <button class="btn" id="btnTogglePanel">
      <span class="btn-icon">💬</span>
      <span>Open Panel</span>
      <span class="shortcut">Alt+Shift+D</span>
    </button>
    <button class="btn" id="btnReview">
      <span class="btn-icon">📝</span>
      <span>Review Document</span>
    </button>
    <button class="btn" id="btnSettings">
      <span class="btn-icon">⚙️</span>
      <span>Settings</span>
    </button>
  </div>
  <div class="site-access">
    <div class="site-access-row">
      <div class="site-access-title">在所有网站启用</div>
      <label class="switch" aria-label="在所有网站启用 Doc Copilot">
        <input type="checkbox" id="allSitesToggle">
        <span class="switch-track"></span>
      </label>
    </div>
    <div class="site-access-desc">可选权限。开启后，任意 HTTPS 内容页都能使用悬浮窗；登录、支付等敏感页面会自动跳过。</div>
    <div class="site-access-status" id="allSitesStatus">正在检查权限…</div>
  </div>
  <div class="footer">
    v0.2.94 · 常用站点默认启用 · 可选全站访问
  </div>
  <script src="popup.js"></script>
</body>
</html>

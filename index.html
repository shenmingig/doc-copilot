<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doc Copilot</title>
    <meta
      name="description"
      content="Doc Copilot support and privacy information."
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #182033;
        --muted: #5d667a;
        --line: #dfe4ee;
        --accent: #1768e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 34px;
        line-height: 1.18;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Doc Copilot</h1>
        <p>
          Doc Copilot is a Chrome extension that helps with document
          autocomplete, rewriting, review, chat, and export workflows.
        </p>
        <p>
          This site hosts public policy and support information for the
          extension.
        </p>
        <div class="links">
          <a class="button" href="./privacy-policy.html">Privacy Policy</a>
        </div>
      </section>
    </main>
  </body>
</html>
